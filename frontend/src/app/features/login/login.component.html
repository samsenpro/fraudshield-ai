<div class="login">
  <mat-card class="login__card">
    <div class="login__brand">
      <mat-icon>shield</mat-icon>
      <h1>FraudShield AI</h1>
    </div>

    <mat-tab-group>
      <mat-tab label="Sign in">
        <form class="login__form" [formGroup]="loginForm" (ngSubmit)="submitLogin()">
          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" autocomplete="email" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Password</mat-label>
            <input matInput type="password" formControlName="password" autocomplete="current-password" />
          </mat-form-field>

          @if (errorMessage()) {
            <p class="login__error">{{ errorMessage() }}</p>
          }

          <button mat-flat-button color="primary" type="submit" [disabled]="loginForm.invalid || loading()">
            @if (loading()) {
              <mat-spinner diameter="20"></mat-spinner>
            } @else {
              Sign in
            }
          </button>
        </form>
      </mat-tab>

      <mat-tab label="Create organization">
        <form class="login__form" [formGroup]="registerForm" (ngSubmit)="submitRegister()">
          <mat-form-field appearance="outline">
            <mat-label>Organization name</mat-label>
            <input matInput formControlName="organizationName" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Your full name</mat-label>
            <input matInput formControlName="fullName" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" autocomplete="email" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Password</mat-label>
            <input matInput type="password" formControlName="password" autocomplete="new-password" />
            <mat-hint>At least 8 characters.</mat-hint>
          </mat-form-field>

          @if (errorMessage()) {
            <p class="login__error">{{ errorMessage() }}</p>
          }

          <button mat-flat-button color="primary" type="submit" [disabled]="registerForm.invalid || loading()">
            @if (loading()) {
              <mat-spinner diameter="20"></mat-spinner>
            } @else {
              Create organization &amp; sign in
            }
          </button>
          <p class="login__hint">
            This creates a new organization and makes you its first ADMIN user.
          </p>
        </form>
      </mat-tab>
    </mat-tab-group>
  </mat-card>
</div>
