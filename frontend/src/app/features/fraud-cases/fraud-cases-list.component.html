<h1 class="page-title">Fraud Cases</h1>

<mat-card class="table-card">
  @if (loading()) {
    <mat-spinner diameter="32"></mat-spinner>
  } @else {
    <table mat-table [dataSource]="cases()">
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let c"><app-status-chip [status]="c.status"></app-status-chip></td>
      </ng-container>

      <ng-container matColumnDef="decision">
        <th mat-header-cell *matHeaderCellDef>Decision</th>
        <td mat-cell *matCellDef="let c">
          @if (c.decision) {
            <app-status-chip [status]="c.decision"></app-status-chip>
          } @else {
            <span class="muted">—</span>
          }
        </td>
      </ng-container>

      <ng-container matColumnDef="assignedReviewerName">
        <th mat-header-cell *matHeaderCellDef>Reviewer</th>
        <td mat-cell *matCellDef="let c">{{ c.assignedReviewerName ?? 'Unassigned' }}</td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>Opened</th>
        <td mat-cell *matCellDef="let c">{{ c.createdAt | date: 'short' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let c">
          <button mat-stroked-button color="primary" (click)="openDetail(c)">View</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>

    @if (cases().length === 0) {
      <p class="empty-state">No fraud cases yet.</p>
    }

    <mat-paginator
      [length]="totalElements()"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      [pageSizeOptions]="[10, 20, 50]"
      (page)="onPage($event)"
    ></mat-paginator>
  }
</mat-card>
