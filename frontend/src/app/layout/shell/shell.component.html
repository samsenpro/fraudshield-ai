<mat-sidenav-container class="shell">
  <mat-sidenav mode="side" opened class="shell__sidenav">
    <div class="shell__brand">
      <mat-icon>shield</mat-icon>
      <span>FraudShield AI</span>
    </div>
    <mat-nav-list>
      @for (item of navItems; track item.path) {
        <a mat-list-item [routerLink]="item.path" routerLinkActive="shell__nav-item--active">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="shell__toolbar">
      <span class="shell__spacer"></span>
      @if (auth.currentUser(); as user) {
        <span class="shell__user">{{ user.email }} · {{ user.role }}</span>
      }
      <button mat-icon-button (click)="logout()" aria-label="Log out" title="Log out">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <main class="shell__content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
